<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約管理＆レシート印刷システム</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container no-print">
        <h1>予約管理システム</h1>

        <!-- 売上・予約数の折り畳みセクション -->
        <details class="summary-box" open>
            <summary>📊 本日の集計・登録データ (タップして開閉)</summary>
            <div class="summary-content">
                <div class="summary-item">本日の予約数: <span id="today-count">0</span> 件</div>
                <div class="summary-item">本日の総売上: <span id="today-sales">0</span> 円</div>
                <div class="summary-item">登録全予約数: <span id="total-count">0</span> 件</div>
                <div class="summary-item">登録総売上: <span id="total-sales">0</span> 円</div>
            </div>
        </details>

        <!-- 女の子の追加・編集システム -->
        <section class="admin-section">
            <h3>👩 女の子の管理</h3>
            <div class="form-group row-inputs">
                <input type="text" id="new-girl-name" placeholder="女の子の名前を入力">
                <button type="button" id="add-girl-btn">追加</button>
            </div>
            <div class="girl-list-wrapper">
                <ul id="girl-list"></ul>
            </div>
        </section>

        <!-- 予約入力フォーム -->
        <form id="reservation-form">
            <h3>📝 予約情報の入力</h3>

            <div class="form-group">
                <label>日付</label>
                <input type="date" id="reserve-date" required>
            </div>

            <div class="form-group">
                <label>顧客・指名 (区分)</label>
                <input type="text" id="customer-type" placeholder="例: Ｒ・Ｎ、新・本(ぴゅあ)" required>
            </div>

            <div class="form-group">
                <label>女の子</label>
                <select id="girl-select" required>
                    <option value="">-- 女の子を選択してください --</option>
                </select>
            </div>

            <div class="form-group">
                <label>コース時間 (ベース価格自動連動)</label>
                <select id="course-time" required></select>
            </div>

            <div class="form-group">
                <label>延長時間 (追加料金自動連動)</label>
                <select id="extension-time"></select>
            </div>

            <div class="form-group">
                <label>料金 (手動微調整も可能)</label>
                <input type="number" id="total-price" min="0" required>
            </div>

            <div class="form-group">
                <label>開始時刻 (5分単位、翌朝30時まで)</label>
                <select id="start-time" required></select>
            </div>

            <div class="form-group">
                <label>顧客名</label>
                <input type="text" id="customer-name" placeholder="例: やまだ">
            </div>

            <div class="form-group">
                <label>案内時間区分</label>
                <select id="guide-status">
                    <option value="">未選択</option>
                    <option value="着">着</option>
                    <option value="発">発</option>
                    <option value="丁度">丁度</option>
                </select>
            </div>

            <div class="form-group">
                <label>ホテル部屋番 (空欄時は空白出力)</label>
                <input type="text" id="hotel-room" placeholder="例: 301">
            </div>

            <div class="form-group">
                <label>電話番号</label>
                <input type="tel" id="phone-number" placeholder="例: 090-XXXX-XXXX">
            </div>

            <div class="form-group">
                <label>待ち合わせ場所</label>
                <input type="text" id="meeting-place" placeholder="例: アストン前">
            </div>

            <div class="form-group">
                <label>デリ詳細</label>
                <input type="text" id="delivery-details" placeholder="例: 堺区デリ 前店の本指名">
            </div>

            <div class="form-group">
                <label>前回</label>
                <input type="text" id="prev-visit" placeholder="例: 2025年5月31日">
            </div>

            <!-- 無料オプション(複数選択チェックボックス) -->
            <div class="form-group">
                <label>無料オプション (OP)</label>
                <div class="checkbox-grid" id="options-container"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">予約を登録・印刷用プレビューに反映</button>
            </div>
        </form>
    </div>

    <!-- 🖨️ エプソン TM-T88Ⅶ (80mm幅・縦125mm) 伝票デザインエリア -->
    <div id="receipt-print-area" class="receipt-container">
        <!-- 1段目 -->
        <div class="r-row border-bottom">
            <div class="r-col w-33 border-right"><span class="r-label">日付</span><span class="r-val" id="p-date"></span></div>
            <div class="r-col w-34 border-right"><span class="r-label">顧客・指名</span><span class="r-val" id="p-cust-type"></span></div>
            <div class="r-col w-33"><span class="r-label">女の子</span><span class="r-val emphasis" id="p-girl"></span></div>
        </div>
        <!-- 2段目 -->
        <div class="r-row border-bottom">
            <div class="r-col w-33 border-right"><span class="r-label">コース分数</span><span class="r-val bold" id="p-duration"></span></div>
            <div class="r-col w-34 border-right"><span class="r-label">料金</span><span class="r-val bold" id="p-price"></span></div>
            <div class="r-col w-33">
                <span class="r-label">予約時刻</span>
                <span class="r-val bold" id="p-time"></span>
                <span class="r-sub-val" id="p-confirm-time"></span>
            </div>
        </div>
        <!-- 3段目 -->
        <div class="r-row border-bottom">
            <div class="r-col w-33 border-right"><span class="r-label">顧客名</span><span class="r-val" id="p-cust-name"></span></div>
            <div class="r-col w-34 border-right"><span class="r-label">案内時間区分</span><span class="r-val emphasis" id="p-guide"></span></div>
            <div class="r-col w-33">
                <span class="r-label">ホテル部屋番</span>
                <span class="r-val small-text" id="p-room"></span>
            </div>
        </div>
        <!-- 4段目: 電話番号 -->
        <div class="r-row border-bottom">
            <div class="r-col w-100">
                <span class="r-label">電話番号</span>
                <span class="r-val font-large" id="p-phone"></span>
            </div>
        </div>
        <!-- 5段目: 待ち合わせ場所 & OP -->
        <div class="r-row border-bottom" style="height: 52px;">
            <div class="r-col w-66 border-right"><span class="r-label">待ち合わせ場所</span><span class="r-val font-mid" id="p-location"></span></div>
            <div class="r-col w-34"><span class="r-label">OP</span><span class="r-val multi-line" id="p-options"></span></div>
        </div>
        <!-- 6段目: デリ詳細 & 前回 -->
        <div class="r-row" style="height: 42px;">
            <div class="r-col w-66 border-right"><span class="r-label">デリ詳細</span><span class="r-val small-text" id="p-details"></span></div>
            <div class="r-col w-34"><span class="r-label">前回</span><span class="r-val small-text" id="p-prev"></span></div>
        </div>
    </div>

    <!-- 印刷ボタン (プレビュー確認用につけています) -->
    <div class="container no-print" style="margin-top: 10px; margin-bottom: 50px;">
        <button type="button" onclick="window.print()" class="btn-print">この内容でレシート印刷を実行</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
